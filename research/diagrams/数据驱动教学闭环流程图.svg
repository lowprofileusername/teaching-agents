<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>数据驱动教学闭环流程图示例</title>
<desc>全链路数据采集到AI分析到教师研判到精准干预，效果数据回流形成持续迭代闭环。用于教学创新大赛AI赛道汇报PPT。此为通用示例，需替换为自己的课程信息。</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="50" width="130" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="105" y="74" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">数据采集</text>
<text x="105" y="95" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">课前课中课后</text>
<rect x="196" y="50" width="130" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="261" y="74" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">AI 分析</text>
<text x="261" y="95" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">热力图 · 学生画像</text>
<rect x="352" y="50" width="130" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="417" y="74" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">教师研判</text>
<text x="417" y="95" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">定策略 · 找干预点</text>
<rect x="508" y="50" width="130" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="573" y="74" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">精准干预</text>
<text x="573" y="95" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">分层任务 · 个性反馈</text>
<path d="M170 82 L196 82" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<path d="M326 82 L352 82" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<path d="M482 82 L508 82" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<path d="M573 114 L573 155 Q573 165 563 165 L115 165 Q105 165 105 155 L105 114" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="340" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">效果数据回流 · 教学持续迭代</text>
<text x="340" y="222" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">每一环都要有可展示的截图或数据作为证据</text>
</svg>
