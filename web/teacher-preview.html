<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面教师 · 动作与环绕预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#243544;font:16px system-ui}main{max-width:1000px;margin:auto;padding:32px}h1{margin-bottom:8px;font-size:28px}p{line-height:1.7;color:#5a6c79}.layout{display:grid;grid-template-columns:minmax(250px,460px) 1fr;gap:28px}.stage{background:linear-gradient(140deg,#fff,#dbe5ec);border-radius:24px;box-shadow:0 10px 35px #21334116;touch-action:none;position:relative;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none}button,select,input{font:inherit}button,select{padding:10px 16px;margin:5px 4px 5px 0;border-radius:10px;border:1px solid #bdcbd5;background:white;color:#243544;cursor:pointer}button[aria-pressed=true]{background:#264e69;color:white}input[type=range]{width:100%}.panel{padding-top:12px}output{display:block;padding:12px 0;color:#456c88}.note{font-size:13px}.tag{display:inline-block;background:#dae7ee;border-radius:20px;padding:6px 12px;font-size:12px}@media(max-width:650px){main{padding:16px}.layout{grid-template-columns:1fr}.stage{max-width:380px;margin:auto}}</style>
<main><span class="tag">高清分组修订预览</span><h1>桌面教师</h1><p>拖动看正面、侧面与背面，也可以切换行走、坐下和起身动作。</p><div class="layout"><div class="stage"><canvas id="figure" width="600" height="800" tabindex="0" aria-label="教师形象，左右方向键旋转"></canvas></div><div class="panel"><label>教师形象 <select id="who"><option value="female">女教师</option><option value="male">男教师</option></select></label><p><button id="turn">360° 环绕</button><button id="walk" aria-pressed="true">行走</button><button id="sit">坐下</button><button id="stand">起身</button></p><div id="angles"><input id="angle" aria-label="旋转视角" type="range" min="0" max="23" value="0"><div><button data-view="0">正面</button><button data-view="6">右侧</button><button data-view="12">背面</button><button data-view="18">左侧</button></div></div><output id="status">正在载入…</output><p class="note">环绕使用24张生成视图，支持水平方向查看；不是可任意俯仰的三维模型。女教师视图已按统一身高与脚底基线对齐。视角间隔并非精确15度，局部面部与衣褶仍可能存在生成差异。</p><p class="note">女教师行走使用16张高清动作帧，男教师保留原版8帧，坐下与起身使用8张过渡帧。这个预览不调用语音接口，也不加载本地大模型。</p></div></div></main><script type="module" src="teacher-preview.mjs"></script></html>
