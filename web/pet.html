<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面教师</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;color:#243b50;font:12px -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}body{width:220px;height:100vh;position:relative}button,select{font:inherit;border:1px solid #c5d4df;background:#fff;border-radius:7px;padding:5px;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:6px;--wails-draggable:drag}select,button{--wails-draggable:no-drag}select{width:100px}.controls{position:absolute;inset:0 4px auto;padding:8px;background:rgba(249,252,255,.96);border:1px solid #d6e0e9;border-radius:12px;opacity:0;transition:opacity .15s;z-index:2;box-shadow:0 3px 12px #0002}body:hover .controls,.controls:focus-within{opacity:1}#teacher{position:absolute;bottom:0;left:20px;width:180px;height:var(--teacher-height,240px);cursor:grab;--wails-draggable:drag;touch-action:none}.row{display:flex;gap:4px;margin-top:6px}.row button{flex:1}button[aria-pressed="true"]{background:#d9e9f8;border-color:#507da7}#state,#postureStatus,#voiceState{font-size:11px;margin-top:4px}#voiceState{color:#306487}#speechBubble{position:absolute;bottom:calc(var(--teacher-height,240px) + 5px);left:15px;right:15px;padding:8px 10px;border-radius:12px;background:rgba(245,250,255,.97);border:1px solid #c6d7e3;font-size:12px;pointer-events:none}#speechBubble[hidden]{display:none}.note{font-size:10px;color:#73828e;margin:5px 0 0}body[data-speaking="true"] #speechBubble{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{box-shadow:0 0 10px #73a4ca70}}
</style></head><body><div class="controls"><header><strong>桌面教师</strong><select id="template" aria-label="教师形象"><option value="female">原创女教师</option><option value="male">原创男教师</option></select></header><div class="row"><button id="sit">坐下休息</button><button id="rise">起来走走</button><button id="auto">自动</button></div><div class="row"><button id="rotate">360° 查看</button><button id="animate">恢复动作</button></div><input id="angle" type="range" min="0" max="23" value="0" aria-label="旋转视角" hidden><div class="row"><label>速度 <input id="speed" type="range" min="40" max="220" value="120" style="width:94px" aria-label="移动速度"></label><span id="speedValue">120 px/s</span></div><div class="row"><label><input id="pin" type="checkbox">固定位置</label><label>大小 <select id="size" aria-label="教师大小"><option value=".65">迷你</option><option value="1" selected>轻巧</option><option value="1.2">大</option></select></label></div><div class="row"><button id="testVoice">听我说话</button><button id="voiceSettings">声音设置</button></div><div id="postureStatus" role="status"></div><div id="state" role="status">等待连接…</div><div id="voiceState" role="status"></div><div class="row"><button id="open">打开工作台</button><button id="hide">隐藏</button><button id="stopVoice" hidden>停止朗读</button></div><p class="note">拖动人物或标题移动；旋转模式拖动查看 · 原创AI形象与合成声音</p></div><div id="speechBubble" hidden></div><canvas id="teacher" width="480" height="640" tabindex="0" role="button" aria-label="拖动移动桌面教师；回车打开工作台"></canvas><script type="module" src="pet.mjs"></script></body></html>
