<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面教师</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;color:#243b50;font:12px -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}body{width:220px;height:100vh;position:relative}button,select{font:inherit;border:1px solid #c5d4df;background:#fff;border-radius:7px;padding:5px;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:6px;--wails-draggable:no-drag}select,button,input,label{--wails-draggable:no-drag}select{width:100px}
.controls{position:absolute;inset:0 4px auto;padding:8px;background:rgba(249,252,255,.97);border:1px solid #d6e0e9;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:4;box-shadow:0 3px 12px #0002;max-height:96vh;overflow:auto}
.controls.expanded{opacity:1;pointer-events:auto}
.row{display:flex;gap:4px;margin-top:6px;align-items:center}.row button{flex:1}button[aria-pressed="true"]{background:#d9e9f8;border-color:#507da7}#state,#postureStatus,#voiceState{font-size:11px;margin-top:4px}#voiceState{color:#306487}
#teacher{position:absolute;bottom:0;left:20px;width:180px;height:var(--teacher-height,240px);cursor:grab;--wails-draggable:no-drag;touch-action:none}
#speechBubble,#hoverBubble{position:absolute;left:15px;right:15px;padding:8px 10px;border-radius:12px;background:rgba(245,250,255,.97);border:1px solid #c6d7e3;font-size:12px;pointer-events:none}
#speechBubble{bottom:calc(var(--teacher-height,240px) + 5px)}#speechBubble[hidden]{display:none}
#hoverBubble{bottom:calc(var(--teacher-height,240px) + 5px);background:rgba(255,252,240,.97);border-color:#e2d3a8}#hoverBubble[hidden]{display:none}
.note{font-size:10px;color:#73828e;margin:5px 0 0}body[data-speaking="true"] #speechBubble{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{box-shadow:0 0 10px #73a4ca70}}
#miniMenu{position:absolute;z-index:6;min-width:150px;background:rgba(255,255,255,.98);border:1px solid #c5d4df;border-radius:9px;box-shadow:0 4px 14px #0003;padding:4px;display:none;--wails-draggable:no-drag}
#miniMenu.open{display:block}#miniMenu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:7px 9px}#miniMenu button:hover{background:#e8f1fa}#miniMenu hr{border:0;border-top:1px solid #e2e9f0;margin:4px 2px}
</style></head><body>
<div class="controls" id="controls"><header><strong>桌面教师 · 完整选项</strong><button id="collapse" aria-label="收起选项">收起 ✕</button></header>
<div class="row"><label>形象 <select id="template" aria-label="教师形象"><option value="female">原创女教师</option><option value="male">原创男教师</option></select></label></div>
<div class="row"><button id="sit">坐下休息</button><button id="rise">起来走走</button><button id="auto">自动</button></div>
<div class="row"><button id="rotate">360° 查看</button><button id="animate">恢复动作</button></div>
<input id="angle" type="range" min="0" max="23" value="0" aria-label="旋转视角（24视角完整360°）" hidden>
<div class="row"><label>速度 <input id="speed" type="range" min="40" max="220" value="120" style="width:94px" aria-label="移动速度"></label><span id="speedValue">120 px/s</span></div>
<div class="row"><label><input id="pin" type="checkbox">固定位置</label><label>大小 <select id="size" aria-label="教师大小"><option value=".65">迷你</option><option value="1" selected>轻巧</option><option value="1.2">大</option></select></label></div>
<div class="row"><label><input id="sound" type="checkbox" checked>动作音效</label><label><input id="quiet" type="checkbox">静音</label></div>
<div class="row"><button id="testVoice">听我说话</button><button id="voiceSettings">声音设置</button></div>
<div id="postureStatus" role="status"></div><div id="state" role="status">等待连接…</div><div id="voiceState" role="status"></div>
<div class="row"><button id="open">打开工作台</button><button id="hide">隐藏</button><button id="stopVoice" hidden>停止朗读</button></div>
<p class="note">右键人物＝最小菜单；拖动移动；旋转模式拖动或滚轮查看完整360° · 原创AI形象与合成声音</p></div>
<div id="miniMenu" role="menu">
<button id="mmOpen" role="menuitem">打开工作台</button>
<button id="mmSound" role="menuitem">音效：开</button>
<button id="mmPin" role="menuitem">定住</button>
<button id="mmMore" role="menuitem">更多选项…</button><hr>
<button id="mmHide" role="menuitem">隐藏</button>
</div>
<div id="hoverBubble" hidden></div><div id="speechBubble" hidden></div>
<canvas id="teacher" width="480" height="640" tabindex="0" role="button" aria-label="拖动移动桌面教师；右键打开菜单；回车打开工作台"></canvas>
<script type="module" src="pet.mjs"></script></body></html>
