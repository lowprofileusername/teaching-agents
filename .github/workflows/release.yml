name: Windows and Apple Silicon release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      TEACHING_TEST_KEYRING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
      - name: Build typed React shell
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Test Windows implementation
        run: go test -v ./...
      - name: Test PDF text extraction
        run: |
          node tests/pdf-smoke.mjs
          node tests/markdown.mjs
          node tests/retrieval-context.mjs
          node tests/evidence.mjs
          node tests/speech.mjs
          node tests/teacher-animation.mjs
          node tests/workspace-data.mjs
          node tests/workspace-memory.mjs
          node tests/document-review.mjs
          node tests/material-visuals.mjs
          node tests/lecture-timeline.mjs
          node tests/lecture-question.mjs
          node tests/builder.mjs
          node tests/revise.mjs
          node tests/syllabus.mjs
          node tests/lessonplan.mjs
          node tests/pet.mjs
          node tests/task-resume.mjs
      - name: Build two original teachers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($persona in @('original','male')) {
            go build -tags desktop -trimpath -ldflags "-s -w -H windowsgui -X main.defaultPersona=$persona" -o "dist/teaching-agent-$persona-windows-amd64.exe" .
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $persona" }
          }
      - name: Start and verify actual Windows executables
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - name: Verify actual Windows teacher transparency
        shell: pwsh
        run: ./tests/windows-transparency.ps1
      - name: Save native transparency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-teacher-transparency
          path: ${{ runner.temp }}/teacher-transparency/*
          if-no-files-found: ignore
      - name: Package documentation and checksums
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.txt
          Copy-Item RELEASE_NOTES.md dist/
          Copy-Item THIRD_PARTY_LICENSES.txt dist/
          Copy-Item library_query.py dist/
          $lines = Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - name: Publish release after all checks pass
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          $args = @('release','create',$env:RELEASE_TAG,'--verify-tag','--draft','--title',"Teaching Agents $env:RELEASE_TAG",'--notes-file','RELEASE_NOTES.md') + $files
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

  macos:
    needs: release
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: true
      - name: Build typed React shell
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Test native Mac implementation
        run: go test -v ./...
      - name: Package Apple Silicon apps
        run: python3 tests/build_macos.py
      - name: Test actual Mac app executable
        run: python3 tests/macos-smoke.py
      - name: Add Mac apps and publish complete release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/macos/*.zip dist/macos/SHA256SUMS-macos.txt
          gh release edit "$RELEASE_TAG" --draft=false
